name: Prepare exact sources
description: Materialize the exact unpublished Kernel, SDK, and Shell sources used by this CLI revision.

inputs:
  repository-token:
    description: GitHub token with read access to the Kernel, SDK, and Shell repositories.
    required: true

runs:
  using: composite
  steps:
    - name: Require repository access
      shell: bash
      env:
        REPOSITORY_TOKEN: ${{ inputs.repository-token }}
      run: |
        if [ -z "$REPOSITORY_TOKEN" ]; then
          echo "::error::Exact source checkout requires Kernel, SDK, and Shell repository read access."
          exit 1
        fi
    - name: Check out Kernel
      uses: actions/checkout@v4
      with:
        repository: astrale-os/kernel
        ref: 7dba075887e4796e5464d5a41ddb03212eed887f
        path: .cohort/kernel
        token: ${{ inputs.repository-token }}
        persist-credentials: false
    - name: Check out SDK
      uses: actions/checkout@v4
      with:
        repository: astrale-os/sdk
        ref: 3c9962af28baa94b4d7da94667eec8f119319ac5
        path: .cohort/sdk
        token: ${{ inputs.repository-token }}
        persist-credentials: false
    - name: Check out Shell
      uses: actions/checkout@v4
      with:
        repository: astrale-os/shell
        ref: a9573b7d304186d110ee04ae55b70d7d362cdc05
        path: .cohort/shell
        token: ${{ inputs.repository-token }}
        persist-credentials: false
    - name: Bind SDK-owned Kernel source links
      shell: bash
      run: |
        mkdir -p .cohort/sdk/.cohort
        ln -s ../../kernel .cohort/sdk/.cohort/kernel
