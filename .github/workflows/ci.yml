name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0

jobs:
  compatibility:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26', '24', '22']
    env:
      # Node 26 is primary, Node 24 is supported for development, and Node 22
      # deliberately exercises the published runtime contract against source.
      PNPM_CONFIG_RUNTIME_ON_FAIL: ${{ matrix.node-version == '22' && 'ignore' || 'error' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require exact-cohort repository credential
        env:
          COHORT_REPOSITORY_TOKEN: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$COHORT_REPOSITORY_TOKEN" ]; then
            echo "::error::COHORT_REPOSITORY_TOKEN must read the private Kernel, SDK, and Shell repositories."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/kernel
          ref: 7dba075887e4796e5464d5a41ddb03212eed887f
          path: .kernel-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/sdk
          ref: 9c799c26bfae01adc09dc93c8acc2a8c993ca0f1
          path: .sdk-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/kernel
          ref: 7dba075887e4796e5464d5a41ddb03212eed887f
          path: .sdk-cohort/.kernel-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/shell
          ref: fad6dc54e3686567282c8aee779a117bfbb7c6c5
          path: .shell-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: STANDALONE=true pnpm install --frozen-lockfile
      - name: Check public dependency closure
        run: node scripts/verify-public-dependency-boundary.mjs
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build the Node package
        run: pnpm build
      - name: Smoke-test the Node runtime
        run: |
          node dist/astrale.js --version
          node dist/astrale.js --help >/dev/null

  studio-browser:
    name: Studio browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require exact-cohort repository credential
        env:
          COHORT_REPOSITORY_TOKEN: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$COHORT_REPOSITORY_TOKEN" ]; then
            echo "::error::COHORT_REPOSITORY_TOKEN must read the private Kernel, SDK, and Shell repositories."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/kernel
          ref: 7dba075887e4796e5464d5a41ddb03212eed887f
          path: .kernel-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/sdk
          ref: 9c799c26bfae01adc09dc93c8acc2a8c993ca0f1
          path: .sdk-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/kernel
          ref: 7dba075887e4796e5464d5a41ddb03212eed887f
          path: .sdk-cohort/.kernel-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/shell
          ref: fad6dc54e3686567282c8aee779a117bfbb7c6c5
          path: .shell-cohort
          token: ${{ secrets.COHORT_REPOSITORY_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: STANDALONE=true pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir studio exec playwright install --with-deps chromium
      - name: Run Studio browser smoke
        run: pnpm --dir studio test:e2e
