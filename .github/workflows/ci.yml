name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0

jobs:
  ui-search-contract:
    uses: ./.github/workflows/ui-search-contract.yml
    with:
      ui-ref: main

  compatibility:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26', '24', '22']
    env:
      # Node is a contributor/test toolchain only; releases are Bun executables.
      PNPM_CONFIG_RUNTIME_ON_FAIL: ${{ matrix.node-version == '22' && 'ignore' || 'error' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Prove tokenless npmjs qualification
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          ! npm config list --json | grep -Eq '"//[^" ]+:_authToken"'
      - name: Install dependencies
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
        run: STANDALONE=true pnpm install --frozen-lockfile
      - name: Generate embedded assets
        run: pnpm assets:ensure
      - name: Check public dependency closure
        run: node scripts/verify-public-dependency-boundary.mjs
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Live Astrale skill update E2E
        if: matrix.node-version == '24'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: pnpm test:skills-e2e
      - name: Build development artifacts
        run: pnpm build
      - name: Smoke-test the development bundle
        run: |
          node dist/astrale.js --version
          node dist/astrale.js --help >/dev/null

  studio-browser:
    name: Studio browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
        run: STANDALONE=true pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir studio exec playwright install --with-deps chromium
      - name: Run Studio browser smoke
        run: pnpm --dir studio test:e2e
