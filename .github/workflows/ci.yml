name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUN_VERSION: latest

jobs:
  compatibility:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    env:
      # Contributors use Node 24. The Node 22 lane deliberately exercises the
      # published runtime contract against the source worktree.
      PNPM_CONFIG_RUNTIME_ON_FAIL: ignore
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Configure GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ASTRALE_PACKAGES_TOKEN || github.token }}
        run: |
          set -eu
          printf '%s\n' '@astrale-os:registry=https://npm.pkg.github.com' >> "$HOME/.npmrc"
          printf '%s\n' "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
      - name: Install dependencies
        run: STANDALONE=true pnpm install --frozen-lockfile
      - name: Install Studio dependencies
        working-directory: studio
        run: bun install --no-save
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build the Node package
        run: pnpm build
      - name: Smoke-test the Node runtime
        run: |
          node dist/astrale.js --version
          node dist/astrale.js --help >/dev/null
