name: CLI Release

on:
  workflow_call:
    inputs:
      version:
        description: Immutable package version created by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Immutable package version to recover; leave empty for canary
        required: false
        type: string

concurrency:
  group: cli-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.version != '' && format('refs/tags/cli/v{0}', inputs.version) || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.1.0
      - name: Install dependencies
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
        run: STANDALONE=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate embedded assets
        run: pnpm assets:ensure
      - name: Check public dependency closure
        run: node scripts/verify-public-dependency-boundary.mjs
      - name: Test
        run: pnpm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: x64
            bun_target: bun-linux-x64
          - os: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
            bun_target: bun-linux-arm64
          - os: macos-15-intel
            target_os: darwin
            target_arch: x64
            bun_target: bun-darwin-x64
          - os: macos-14
            target_os: darwin
            target_arch: arm64
            bun_target: bun-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.version != '' && format('refs/tags/cli/v{0}', inputs.version) || github.sha }}
      - id: source
        name: Resolve checked-out source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.1.0
      - name: Install dependencies
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
        run: STANDALONE=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Build binary
        run: |
          set -eu
          mkdir -p dist
          bun scripts/build-embedded-assets.ts
          bun build --compile --target=${{ matrix.bun_target }} \
            --define '__ASTRALE_BUNDLED__=true' \
            --define '__ASTRALE_SOURCE_REVISION__="${{ steps.source.outputs.sha }}"' \
            bin/astrale.ts --outfile dist/astrale
          if [ "${{ matrix.target_os }}" = darwin ]; then
            # Bun's built-in ad-hoc signer currently handles ARM64 only.
            if [ "${{ matrix.target_arch }}" = x64 ]; then
              codesign --force --sign - dist/astrale
            fi
            codesign --verify --strict --verbose=4 dist/astrale
          fi
          ./dist/astrale --version
          ./dist/astrale --help >/dev/null
          ./dist/astrale skills status --json >/dev/null
      - name: Qualify skill update with the built binary
        env:
          ASTRALE_E2E_CLI: ./dist/astrale
          ASTRALE_E2E_SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          pnpm test:skills-e2e
          if test -f scripts/qualification/standalone-upgrade-e2e.mjs; then
            node scripts/qualification/standalone-upgrade-e2e.mjs dist/astrale dist/astrale
          fi
      - name: Package asset
        run: |
          set -eu
          asset="astrale-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          node scripts/package-release-asset.mjs dist/astrale "$asset.tar.gz"
          printf 'astrale\n' > dist/archive-entries
          tar -tzf "$asset.tar.gz" | cmp - dist/archive-entries
          mkdir -p dist/archive-check
          tar -xzf "$asset.tar.gz" -C dist/archive-check
          cmp dist/astrale dist/archive-check/astrale
          test -x dist/archive-check/astrale
          if [ "${{ matrix.target_os }}" = darwin ]; then
            codesign --verify --strict --verbose=4 dist/archive-check/astrale
          fi
          ./dist/archive-check/astrale --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrale-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: astrale-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: cli-release
    permissions:
      contents: write
      # Sigstore build provenance for every published archive.
      id-token: write
      attestations: write
    concurrency:
      group: cli-release-channel-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.version != '' && format('refs/tags/cli/v{0}', inputs.version) || github.sha }}
      - name: Check out exact release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
      - id: source
        name: Resolve checked-out source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - id: meta
        name: Resolve release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/resolve-cli-release.mjs
      - name: Generate checksums
        run: |
          set -eu
          cd release-assets
          sha256sum astrale-*.tar.gz > sha256sums.txt
      - name: Generate update manifest
        run: |
          set -eu
          cd release-assets
          {
            printf '{\n'
            printf '  "version": "%s",\n' '${{ steps.meta.outputs.version }}'
            printf '  "binaryVersion": "%s",\n' '${{ steps.meta.outputs.binary_version }}'
            printf '  "channel": "%s",\n' '${{ steps.meta.outputs.channel }}'
            printf '  "repo": "%s",\n' '${{ github.repository }}'
            printf '  "assets": {\n'
            first=1
            for file in astrale-*.tar.gz; do
              platform="${file#astrale-}"
              platform="${platform%.tar.gz}"
              sha="$(awk -v f="$file" '$2 == f { print $1 }' sha256sums.txt)"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    "%s": { "name": "%s", "sha256": "%s" }' "$platform" "$file" "$sha"
            done
            printf '\n  }\n'
            printf '}\n'
          } > manifest.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/astrale-*.tar.gz
      - name: Publish immutable version release
        if: steps.meta.outputs.immutable_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.immutable_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BINARY_VERSION: ${{ steps.meta.outputs.binary_version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.sha }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -eu
          node .release-tooling/scripts/publish-release-assets.mjs --verify-tag "$TAG" "$EXPECTED_COMMIT"
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          # Release Please leaves the version release as a draft; a recovered version without a
          # release is staged the same way. Assets are uploaded before publication because GitHub
          # locks the tag and every asset of an immutable release once it is published.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Astrale CLI $VERSION" --notes "Astrale CLI $VERSION" $flags
          fi
          node .release-tooling/scripts/publish-release-assets.mjs "$TAG" release-assets
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false $flags
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" != "true" ]; then
            echo "::error::$TAG is published but not immutable; no channel moves to a release whose assets can change." >&2
            exit 1
          fi
      - name: Qualify the published version binary
        if: steps.meta.outputs.immutable_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.immutable_tag }}
          ASTRALE_E2E_SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          set -eu
          qualification_dir="$(mktemp -d)"
          trap 'rm -rf "$qualification_dir"' EXIT
          gh release download "$TAG" \
            --pattern astrale-linux-x64.tar.gz \
            --dir "$qualification_dir"
          tar -C "$qualification_dir" -xzf "$qualification_dir/astrale-linux-x64.tar.gz"
          GH_TOKEN='' GITHUB_TOKEN='' \
          ASTRALE_E2E_CLI="$qualification_dir/astrale" \
            node scripts/qualification/skills-update-e2e.mjs
      # A channel is a pointer file, never a release: GitHub seals an immutable release on any edit.
      - name: Publish channel pointer
        if: steps.meta.outputs.immutable_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.sha }}
        run: node .release-tooling/scripts/publish-channel-pointer.mjs "$CHANNEL" release-assets/manifest.json
      - name: Release summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## CLI release

          - Version: \`${{ steps.meta.outputs.version }}\`
          - Channel: \`${{ steps.meta.outputs.channel }}\`
          - Install: \`curl -fsSL https://raw.githubusercontent.com/astrale-os/cli/main/install.sh | ASTRALE_CHANNEL=${{ steps.meta.outputs.channel }} sh\`
          EOF
