name: CLI Release

on:
  workflow_call:
    inputs:
      version:
        description: Immutable package version created by Release Please
        required: true
        type: string
  push:
    tags: ['cli/v*']
  workflow_dispatch:
    inputs:
      version:
        description: Immutable package version to recover; leave empty for canary
        required: false
        type: string

concurrency:
  group: cli-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - name: Install dependencies
        run: STANDALONE=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Check public dependency closure
        run: node scripts/verify-public-dependency-boundary.mjs
      - name: Test
        run: pnpm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: x64
            bun_target: bun-linux-x64
          - os: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
            bun_target: bun-linux-arm64
          - os: macos-15-intel
            target_os: darwin
            target_arch: x64
            bun_target: bun-darwin-x64
          - os: macos-14
            target_os: darwin
            target_arch: arm64
            bun_target: bun-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - name: Install dependencies
        run: STANDALONE=true pnpm install --frozen-lockfile --ignore-scripts
      - name: Build binary
        run: |
          set -eu
          mkdir -p dist
          bun build --compile --target=${{ matrix.bun_target }} bin/astrale.ts --outfile dist/astrale
          ./dist/astrale --version
          ./dist/astrale --help >/dev/null
      - name: Package asset
        run: |
          set -eu
          asset="astrale-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          tar -C dist -czf "$asset.tar.gz" astrale
      - uses: actions/upload-artifact@v4
        with:
          name: astrale-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: astrale-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - id: meta
        name: Resolve release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/resolve-cli-release.mjs
      - name: Generate checksums
        run: |
          set -eu
          cd release-assets
          sha256sum astrale-*.tar.gz > sha256sums.txt
      - name: Generate update manifest
        run: |
          set -eu
          cd release-assets
          {
            printf '{\n'
            printf '  "version": "%s",\n' '${{ steps.meta.outputs.version }}'
            printf '  "binaryVersion": "%s",\n' '${{ steps.meta.outputs.binary_version }}'
            printf '  "channel": "%s",\n' '${{ steps.meta.outputs.channel }}'
            printf '  "repo": "%s",\n' '${{ github.repository }}'
            printf '  "assets": {\n'
            first=1
            for file in astrale-*.tar.gz; do
              platform="${file#astrale-}"
              platform="${platform%.tar.gz}"
              sha="$(awk -v f="$file" '$2 == f { print $1 }' sha256sums.txt)"
              if [ "$first" -eq 0 ]; then printf ',\n'; fi
              first=0
              printf '    "%s": { "name": "%s", "sha256": "%s" }' "$platform" "$file" "$sha"
            done
            printf '\n  }\n'
            printf '}\n'
          } > manifest.json
      - name: Publish immutable version release
        if: steps.meta.outputs.immutable_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.immutable_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -eu
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Astrale CLI $VERSION" --notes "Astrale CLI $VERSION" $flags
          fi
          gh release upload "$TAG" release-assets/* --clobber
      - name: Publish channel release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -eu
          git tag -f "$CHANNEL" "$GITHUB_SHA"
          git push origin "refs/tags/$CHANNEL" --force
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          if ! gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release create "$CHANNEL" --title "Astrale CLI $CHANNEL" --notes "Current $CHANNEL build: $VERSION" $flags
          else
            gh release edit "$CHANNEL" --title "Astrale CLI $CHANNEL" --notes "Current $CHANNEL build: $VERSION" $flags
          fi
          gh release upload "$CHANNEL" release-assets/* --clobber
      - name: Release summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## CLI release

          - Version: \`${{ steps.meta.outputs.version }}\`
          - Channel: \`${{ steps.meta.outputs.channel }}\`
          - Install: \`curl -fsSL https://raw.githubusercontent.com/astrale-os/cli/main/install.sh | ASTRALE_CHANNEL=${{ steps.meta.outputs.channel }} sh\`
          EOF
