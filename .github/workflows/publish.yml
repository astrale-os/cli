name: Publish

# Publishes @astrale-os/cli to GitHub Packages + public npm after a version
# lands on main, the SAME way the other Astrale repos do: the shared
# astrale-os/config publish/packages action, npm via OIDC Trusted Publishing
# (no NPM_TOKEN), GitHub Packages via the repo token. Idempotent — an
# already-published version is skipped. See docs/release.md.
#
# The published package is the Node-runnable bundle (dist/astrale.js, all
# @astrale-os deps inlined) PLUS the prebuilt Domain Studio (studio/server +
# studio/client/dist), so `npm i -g @astrale-os/cli` gives the CLI under Node
# and `astrale studio` (which additionally needs Bun on PATH).
#
# Release Please owns the version. The binary release consumes the same version
# through release.yml; this workflow publishes its npm/GitHub Packages form.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.release-please-manifest.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # publish to GitHub Packages
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/kernel
          ref: a80568d6083fd3af6f3646a8abb95338e6ae3434
          path: .kernel-cohort
          token: ${{ secrets.NPM_TOKEN || secrets.ASTRALE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/sdk
          ref: 7cf8b9e052da4c5c91c091b56e416ca3e189a8f0
          path: .sdk-cohort
          token: ${{ secrets.NPM_TOKEN || secrets.ASTRALE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/kernel
          ref: a80568d6083fd3af6f3646a8abb95338e6ae3434
          path: .sdk-cohort/.kernel-cohort
          token: ${{ secrets.NPM_TOKEN || secrets.ASTRALE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrale-os/shell
          ref: 8a7ff6147191ac8756a8d18497a400ef03234a41
          path: .shell-cohort
          token: ${{ secrets.NPM_TOKEN || secrets.ASTRALE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      # The CLI builds with Bun (scripts/build.ts) and the studio client build
      # shells out to Bun too — the shared action only sets up Node/pnpm.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: astrale-os/config/.github/actions/publish/packages@main
        with:
          dirs: '.'
          # The action uses this token for the GitHub Packages publication target.
          # Dependency installation resolves the public Astrale cohort from npm.
          github-token: ${{ secrets.ASTRALE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          # Studio is part of the pnpm workspace, so one frozen workspace install
          # materializes both toolchains. Do not mix Bun's package manager into
          # that tree: it replaces pnpm links and can make the following prepack
          # nondeterministic.
          build-command: 'pnpm install --frozen-lockfile --ignore-scripts'
          # Derive prerelease dist-tags from the version (alpha/beta/rc).
          # Stable versions automatically publish to latest.
          prerelease-tag: auto
