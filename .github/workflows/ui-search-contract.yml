name: UI Search Contract

on:
  workflow_call:
    inputs:
      ui-ref:
        description: Exact Astrale UI ref to qualify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ui-ref:
        description: Exact Astrale UI ref to qualify
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0

jobs:
  provider-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astrale-os/ui
          ref: ${{ inputs.ui-ref }}
          path: .provider/ui
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact consumer and provider dependencies
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          STANDALONE=true pnpm install --frozen-lockfile
          pnpm --dir .provider/ui install --frozen-lockfile
      - name: Qualify exact UI producer through the CLI consumer
        run: pnpm qualification:ui-search "$GITHUB_WORKSPACE/.provider/ui"
