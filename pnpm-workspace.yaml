packages:
  - '.'
  - 'studio'

# Keep pnpm 11's one-day default non-strict and never install implicitly before
# `pnpm run` or `pnpm exec`.
minimumReleaseAgeStrict: false
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph. Astrale
# package preinstalls are guarded monorepo checks and are intentional no-ops here.
allowBuilds:
  '@astrale-os/kernel-api': false
  '@astrale-os/kernel-client': false
  '@astrale-os/kernel-core': false
  '@astrale-os/kernel-dsl': false
  '@astrale-os/kernel-ports': false
  '@astrale-os/kernel-protocol': false
  '@astrale-os/kernel-server': false
  '@astrale-os/sdk': false
  '@astrale-os/shell': false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true

# Published npm beta.1 still decodes edge cardinality. These packs are built from
# astrale-os/kernel@kernel-v2 after explicit outgoing/incoming edges. Drop the
# file: overrides once a matching kernel cohort is on the registry.
overrides:
  '@astrale-os/kernel-client': file:vendor/kernel/astrale-os-kernel-client-0.6.0-beta.1.tgz
  '@astrale-os/kernel-core': file:vendor/kernel/astrale-os-kernel-core-0.9.0-beta.1.tgz
  '@astrale-os/kernel-dsl': file:vendor/kernel/astrale-os-kernel-dsl-0.2.0-beta.1.tgz
  '@astrale-os/kernel-ports': file:vendor/kernel/astrale-os-kernel-ports-0.6.0-beta.1.tgz
  '@astrale-os/kernel-protocol': file:vendor/kernel/astrale-os-kernel-protocol-0.5.0-beta.1.tgz
  '@astrale-os/kernel-server': file:vendor/kernel/astrale-os-kernel-server-0.5.0-beta.1.tgz
  '@astrale-os/sdk': file:vendor/astrale-os-sdk-0.5.0-beta.1.tgz
  '@astrale-os/shell': file:vendor/astrale-os-shell-0.3.8-beta.2.tgz
