packages:
  - '.'
  - 'studio'

# Keep pnpm 11's one-day default non-strict and never install implicitly before
# `pnpm run` or `pnpm exec`.
minimumReleaseAgeStrict: false
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph. Astrale
# package preinstalls are guarded monorepo checks and are intentional no-ops here.
allowBuilds:
  '@astrale-os/kernel-api': false
  '@astrale-os/kernel-client': false
  '@astrale-os/kernel-core': false
  '@astrale-os/kernel-dsl': false
  '@astrale-os/kernel-ports': false
  '@astrale-os/shell': false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true

overrides:
  '@astrale-os/kernel-client': link:../../worktrees/kernel-platform-e2e/client
  '@astrale-os/kernel-core': link:../../worktrees/kernel-platform-e2e/core
  '@astrale-os/kernel-dsl': link:../../worktrees/kernel-platform-e2e/dsl
  '@astrale-os/kernel-ports': link:../../worktrees/kernel-platform-e2e/ports
  '@astrale-os/shell': file:/private/tmp/astrale-shell-current-pack/astrale-os-shell-0.3.7.tgz
