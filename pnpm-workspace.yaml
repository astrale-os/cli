packages:
  - '.'
  - 'studio'
  - 'studio/e2e/fixture'
  - 'studio/e2e/fixture/peer'

# The published CLI and its private Studio fixture must consume declared
# package versions rather than being linked together implicitly.
linkWorkspacePackages: false
preferWorkspacePackages: false
hoistWorkspacePackages: false
sharedWorkspaceLockfile: true
strictPeerDependencies: true
blockExoticSubdeps: true
lockfileIncludeTarballUrl: true

# Quarantine every external release for seven days. Astrale publications bypass
# the quarantine, and so does Studio's agent stack: the ACP adapters and the
# Claude Code / Codex builds they drive ship together several times a week, and
# Studio runs exactly the CLI its adapter pins (`pnpm run agents:pin`), so a week
# of delay is a week of agents behind the models and fixes users already have.
# Every other dependency those packages pull in stays quarantined.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - '@jsr/astrale__*'
  - 'create-astrale-domain'
  - '@agentclientprotocol/*'
  - '@anthropic-ai/claude-agent-sdk'
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex'
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph.
allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  # wrangler's runtime, reached through the Studio fixtures' Cloudflare adapter.
  workerd: true
# Third-party `.d.ts` files reach their peer `@types` packages by walking parent
# directories, which only works while dependencies live inside the project tree.
# A machine-level global virtual store relocates them outside it and silently
# breaks type resolution, so pin the per-project store for this workspace.
virtualStoreType: project

# TEMPORARY until the SDK release R6b (carrying S4a, astrale-os/sdk#592) and the Kernel release R1
# are published: consume their packed candidates (program/c1a/packs-r1-mf1/SOURCE.txt and
# program/c1a/sdk-pack/SOURCE.txt in the release program's scratchpad). At R6b, drop this block
# and peerDependencyRules below; pin @astrale-os/sdk to the R6b version in package.json,
# studio/package.json, studio/e2e/fixture/package.json and studio/e2e/fixture/peer/package.json
# (verify-public-dependency-boundary requires the CLI, Studio and the Studio browser fixture to pin
# the same exact SDK; the peer fixture follows, as in #568); reinstall; and run
# scripts/verify-public-dependency-boundary.mjs.
overrides:
  '@astrale-os/sdk': 'file:/private/tmp/claude-501/-Users-bryandjafer-Documents-astrale/c41ded60-7156-4abc-abf0-4e7a7d0c2519/scratchpad/program/c1a/sdk-pack/astrale-os-sdk-0.6.0-beta.9.tgz'
  '@astrale-os/kernel-client': 'file:/private/tmp/claude-501/-Users-bryandjafer-Documents-astrale/c41ded60-7156-4abc-abf0-4e7a7d0c2519/scratchpad/program/c1a/packs-r1-mf1/astrale-os-kernel-client-0.6.0-beta.83.tgz'
  '@astrale-os/kernel-core': 'file:/private/tmp/claude-501/-Users-bryandjafer-Documents-astrale/c41ded60-7156-4abc-abf0-4e7a7d0c2519/scratchpad/program/c1a/packs-r1-mf1/astrale-os-kernel-core-0.9.0-beta.62.tgz'
  '@astrale-os/kernel-dsl': 'file:/private/tmp/claude-501/-Users-bryandjafer-Documents-astrale/c41ded60-7156-4abc-abf0-4e7a7d0c2519/scratchpad/program/c1a/packs-r1-mf1/astrale-os-kernel-dsl-0.2.0-beta.44.tgz'
  '@astrale-os/kernel-protocol': 'file:/private/tmp/claude-501/-Users-bryandjafer-Documents-astrale/c41ded60-7156-4abc-abf0-4e7a7d0c2519/scratchpad/program/c1a/packs-r1-mf1/astrale-os-kernel-protocol-0.5.0-beta.68.tgz'
  '@astrale-os/kernel-server': 'file:/private/tmp/claude-501/-Users-bryandjafer-Documents-astrale/c41ded60-7156-4abc-abf0-4e7a7d0c2519/scratchpad/program/c1a/packs-r1-mf1/astrale-os-kernel-server-0.5.0-beta.70.tgz'
# A `file:` SDK has no semver version, so @astrale-os/shell's `@astrale-os/sdk` peer range cannot
# match it; the R6b pin satisfies that range again.
peerDependencyRules:
  allowAny:
    - '@astrale-os/sdk'
