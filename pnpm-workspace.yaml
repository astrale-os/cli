packages:
  - '.'
  - 'studio'

# Keep pnpm 11's one-day default non-strict and never install implicitly before
# `pnpm run` or `pnpm exec`.
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # First-party Astrale packages are qualified directly; third-party releases remain gated.
  - '@astrale-os/*'
  # Exact exception for the Bun 1.4 toolchain migration; future releases remain gated.
  - 'bun-types@1.4.0'
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph.
allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
