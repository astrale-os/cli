packages:
  - '.'
  - 'studio'
  - '.kernel-cohort/client'
  - '.kernel-cohort/core'
  - '.kernel-cohort/dsl'
  - '.kernel-cohort/protocol'
  - '.kernel-cohort/server'
  - '.sdk-cohort'
  - '.shell-cohort/packages/shell'

# Keep pnpm 11's one-day default non-strict and never install implicitly before
# `pnpm run` or `pnpm exec`.
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # Exact exception for the Bun 1.4 toolchain migration; future releases remain gated.
  - 'bun-types@1.4.0'
  - '@astrale-os/kernel-client@0.6.0-beta.8'
  - '@astrale-os/kernel-core@0.9.0-beta.7'
  - '@astrale-os/kernel-dsl@0.2.0-beta.5'
  - '@astrale-os/kernel-protocol@0.5.0-beta.7'
  - '@astrale-os/kernel-server@0.5.0-beta.8'
  - '@astrale-os/ox@0.1.3'
  - '@astrale-os/sdk@0.5.0-beta.14'
  - '@astrale-os/shell@0.3.8-beta.3'
verifyDepsBeforeRun: false

overrides:
  '@astrale-os/kernel-client': link:.kernel-cohort/client
  '@astrale-os/kernel-core': link:.kernel-cohort/core
  '@astrale-os/kernel-dsl': link:.kernel-cohort/dsl
  '@astrale-os/kernel-protocol': link:.kernel-cohort/protocol
  '@astrale-os/kernel-server': link:.kernel-cohort/server
  '@astrale-os/sdk': link:.sdk-cohort
  '@astrale-os/shell': link:.shell-cohort/packages/shell

# Native build scripts required by the standalone CLI dependency graph. Astrale
# package preinstalls are guarded monorepo checks and are intentional no-ops here.
allowBuilds:
  '@astrale-os/kernel-client': false
  '@astrale-os/kernel-core': false
  '@astrale-os/kernel-dsl': false
  '@astrale-os/kernel-protocol': false
  '@astrale-os/kernel-server': false
  '@astrale-os/sdk': false
  '@astrale-os/shell': false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
