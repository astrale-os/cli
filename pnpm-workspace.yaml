packages:
  - '.'
  - 'studio'

# The published CLI and its private Studio fixture must consume declared
# package versions rather than being linked together implicitly.
linkWorkspacePackages: false

patchedDependencies:
  '@astrale-os/shell@0.4.2-beta.5': 'patches/astrale-os-shell-0.4.2-beta.5-schema-inspect.patch'

# Quarantine every external release for seven days. Only Astrale publications
# and the pinned Bun 1.4 toolchain type package bypass the quarantine.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - 'create-astrale-domain'
  - 'bun-types@1.4.0'
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph.
allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
