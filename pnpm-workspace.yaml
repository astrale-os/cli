packages:
  - '.'
  - 'studio'

# Keep pnpm 11's one-day default non-strict and never install implicitly before
# `pnpm run` or `pnpm exec`.
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # Exact exception for the Bun 1.4 toolchain migration; future releases remain gated.
  - 'bun-types@1.4.0'
  - '@astrale-os/kernel-client@0.6.0-beta.3 || 0.6.0-beta.4'
  - '@astrale-os/kernel-core@0.9.0-beta.2 || 0.9.0-beta.3'
  - '@astrale-os/kernel-dsl@0.2.0-beta.2'
  - '@astrale-os/kernel-protocol@0.5.0-beta.2 || 0.5.0-beta.3'
  - '@astrale-os/kernel-server@0.5.0-beta.3 || 0.5.0-beta.4'
  - '@astrale-os/sdk@0.5.0-beta.3 || 0.5.0-beta.4 || 0.5.0-beta.5'
  - '@astrale-os/kernel-ports@0.6.0-beta.3'
  - '@astrale-os/kernel-runtime@0.6.0-beta.3'
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph. Astrale
# package preinstalls are guarded monorepo checks and are intentional no-ops here.
allowBuilds:
  '@astrale-os/kernel-client': false
  '@astrale-os/kernel-core': false
  '@astrale-os/kernel-dsl': false
  '@astrale-os/kernel-protocol': false
  '@astrale-os/kernel-server': false
  '@astrale-os/sdk': false
  '@astrale-os/shell': false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true

# Shell beta.2 is the only cohort package not published yet. Every published
# dependency resolves through the SemVer ranges declared by the packages.
overrides:
  '@astrale-os/shell': file:vendor/astrale-os-shell-0.3.8-beta.2.tgz
