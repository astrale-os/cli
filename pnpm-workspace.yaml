packages:
  - '.'
  - 'studio'

# Keep pnpm 11's one-day default non-strict and never install implicitly before
# `pnpm run` or `pnpm exec`.
minimumReleaseAgeStrict: false
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph. Astrale
# package preinstalls are guarded monorepo checks and are intentional no-ops here.
allowBuilds:
  '@astrale-os/kernel-api': false
  '@astrale-os/kernel-client': false
  '@astrale-os/kernel-core': false
  '@astrale-os/kernel-dsl': false
  '@astrale-os/kernel-ports': false
  '@astrale-os/kernel-protocol@file:../astrale-kernel-beta17-packs/astrale-os-kernel-protocol-0.5.0-beta.1.tgz': set this to true or false
  '@astrale-os/kernel-server@file:../astrale-kernel-beta17-packs/astrale-os-kernel-server-0.5.0-beta.1.tgz': set this to true or false
  '@astrale-os/sdk@file:../astrale-sdk-publication-v2-pack/astrale-os-sdk-0.5.0-beta.1.tgz': set this to true or false
  '@astrale-os/shell': false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true

overrides:
  '@astrale-os/kernel-client': file:/private/tmp/astrale-kernel-beta17-packs/astrale-os-kernel-client-0.6.0-beta.1.tgz
  '@astrale-os/kernel-core': file:/private/tmp/astrale-kernel-beta17-packs/astrale-os-kernel-core-0.9.0-beta.1.tgz
  '@astrale-os/kernel-dsl': file:/private/tmp/astrale-kernel-beta17-packs/astrale-os-kernel-dsl-0.2.0-beta.1.tgz
  '@astrale-os/kernel-ports': file:/private/tmp/astrale-kernel-beta17-packs/astrale-os-kernel-ports-0.6.0-beta.1.tgz
  '@astrale-os/kernel-protocol': file:/private/tmp/astrale-kernel-beta17-packs/astrale-os-kernel-protocol-0.5.0-beta.1.tgz
  '@astrale-os/kernel-server': file:/private/tmp/astrale-kernel-beta17-packs/astrale-os-kernel-server-0.5.0-beta.1.tgz
  '@astrale-os/sdk': file:/private/tmp/astrale-sdk-publication-v2-pack/astrale-os-sdk-0.5.0-beta.1.tgz
  '@astrale-os/shell': file:/private/tmp/astrale-os-shell-0.3.8-beta.1.tgz
