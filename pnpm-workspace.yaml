packages:
  - '.'
  - 'studio'
  - 'studio/e2e/fixture'
  - 'studio/e2e/fixture/peer'

# The published CLI and its private Studio fixture must consume declared
# package versions rather than being linked together implicitly.
linkWorkspacePackages: false
preferWorkspacePackages: false
hoistWorkspacePackages: false
sharedWorkspaceLockfile: true
strictPeerDependencies: true
blockExoticSubdeps: true
lockfileIncludeTarballUrl: true

# Quarantine every external release for seven days. Only Astrale publications
# bypass the quarantine.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - '@jsr/astrale__*'
  - 'create-astrale-domain'
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph.
allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: true

# Published declarations must resolve their own imports in the global virtual store.
# Remove each version-scoped extension when its upstream manifest is corrected.
packageExtensions:
  '@floating-ui/react-dom@2.1.9':
    peerDependencies:
      '@types/react': '>=16.8.0 <20'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'cmdk@1.1.1':
    peerDependencies:
      '@types/react': '^18 || ^19'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'lucide-react@1.31.0':
    peerDependencies:
      '@types/react': '>=16.8.0 <20'
    peerDependenciesMeta:
      '@types/react':
        optional: true
