packages:
  - '.'
  - 'studio'
  - 'studio/e2e/fixture'
  - 'studio/e2e/fixture/peer'

# The published CLI and its private Studio fixture must consume declared
# package versions rather than being linked together implicitly.
linkWorkspacePackages: false
preferWorkspacePackages: false
hoistWorkspacePackages: false
sharedWorkspaceLockfile: true
strictPeerDependencies: true
blockExoticSubdeps: true
lockfileIncludeTarballUrl: true

# Quarantine every external release for seven days. Astrale publications bypass
# the quarantine, and so does Studio's agent stack: the ACP adapters and the
# Claude Code / Codex builds they drive ship together several times a week, and
# Studio runs exactly the CLI its adapter pins (`pnpm run agents:pin`), so a week
# of delay is a week of agents behind the models and fixes users already have.
# Every other dependency those packages pull in stays quarantined.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - '@jsr/astrale__*'
  - 'create-astrale-domain'
  - '@agentclientprotocol/*'
  - '@anthropic-ai/claude-agent-sdk'
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex'
verifyDepsBeforeRun: false

# Native build scripts required by the standalone CLI dependency graph.
allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  # wrangler's runtime, reached through the Studio fixtures' Cloudflare adapter.
  workerd: true
# Third-party `.d.ts` files reach their peer `@types` packages by walking parent
# directories, which only works while dependencies live inside the project tree.
# A machine-level global virtual store relocates them outside it and silently
# breaks type resolution, so pin the per-project store for this workspace.
virtualStoreType: project

# TEMPORARY until an SDK release pins the Kernel release that carries K10 (astrale-os/kernel#1116),
# K11a (#1121) and K14 (#1122): kernel#1142 (3955451e4) published them, with K11b (#1124) and K17
# (#1126), as kernel-client 0.6.0-beta.84 and its cohort, while @astrale-os/sdk 0.6.0-beta.11 still
# pins the R1 cohort (kernel-client 0.6.0-beta.83). Override the SDK's five Kernel dependencies to
# those published versions. When an SDK release pins them, drop this block, pin that SDK in the
# four workspace manifests and run scripts/verify-public-dependency-boundary.mjs, which refuses
# these overrides until then.
overrides:
  '@astrale-os/kernel-client': '0.6.0-beta.84'
  '@astrale-os/kernel-core': '0.9.0-beta.63'
  # TEMPORARY (install pre-check): the pre-check runs the Kernel's compatibility engine, so its
  # kernel-dsl must carry astrale-os/kernel#1149 and #1146, which no Kernel release has yet. This
  # pack is kernel-dsl from astrale-os/kernel aac183517 (#1149 rebased on main dfe83d4a1, which
  # holds #1146), re-versioned 0.2.0-beta.45.c6.aac183517 so that it is never taken for the
  # published 0.2.0-beta.45. Its path is local to the machine that proves this branch: the commit
  # never merges as is. Before merge, replace it by the Kernel release that carries both, pinning
  # all five Kernel packages of this block to that release's cohort; the whole block goes with the
  # SDK release that pins the cohort.
  '@astrale-os/kernel-dsl': 'file:/private/tmp/claude-501/-Users-bryandjafer-Documents-astrale/c41ded60-7156-4abc-abf0-4e7a7d0c2519/scratchpad/program/c6/packs/astrale-os-kernel-dsl-0.2.0-beta.45.c6.aac183517.tgz'
  '@astrale-os/kernel-protocol': '0.5.0-beta.69'
  '@astrale-os/kernel-server': '0.5.0-beta.71'
