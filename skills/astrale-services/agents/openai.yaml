interface:
  display_name: 'Service Deployer'
  short_description: 'Build, deploy, and verify callable services'
  default_prompt: 'Use $astrale-services to turn the code or requirements I provide into a deployed Astrale Service with the requested published Functions: infer the contract from authoritative code or requirements, ask only for missing deployment decisions, build or adapt the implementation, deploy it under one stable serviceKey, admit the returned Publication without claiming Services installed it, deliberately install on requested consumer Kernels, invoke every Function end to end, fix failures, and return exact copy-paste calls with observed results.'
