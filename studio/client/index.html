<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domain Studio</title>
    <!-- Tab icon: a ring around a dot, in the theme's primary blue. Inlined so it
         ships with the HTML shell and needs no extra static file. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Ecircle%7Bcolor:%233069b2%7D@media (prefers-color-scheme:dark)%7Bcircle%7Bcolor:%235e93e1%7D%7D%3C/style%3E%3Ccircle cx='16' cy='16' r='12.5' fill='none' stroke='currentColor' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='currentColor'/%3E%3C/svg%3E"
    />
    <script>
      // Paint the theme before the first frame — the app would otherwise flash light.
      try {
        var pref = localStorage.getItem('studio.theme') || 'system'
        if (
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
